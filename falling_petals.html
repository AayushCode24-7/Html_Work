<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petal Interaction - Constant Wind</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a; 
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            /* Standard cursor restored, custom pointer removed */
            cursor: default; 
        }

        #petal-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
        }

        .instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="instructions">
        <h1>Petal Interaction</h1>
        <p>Click anywhere to scatter petals.</p>
    </div>

    <canvas id="petal-canvas"></canvas>

    <script>
        const canvas = document.getElementById('petal-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        // Configuration
        const config = {
            petalCount: 20,       
            gravity: 0.1,         
            windStrength: 1.2,    // Constant push to the right
            fadeSpeed: 0.008,     
            colors: [340, 350, 0, 15] 
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Petal {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 7 + 4;
                // Burst effect on click
                this.speedX = Math.random() * 4 - 2;
                this.speedY = Math.random() * 2 + 1;
                
                this.angle = Math.random() * Math.PI * 2;
                this.spin = Math.random() * 0.05 - 0.025;
                
                const hue = config.colors[Math.floor(Math.random() * config.colors.length)];
                this.color = `hsl(${hue}, 100%, 90%)`;
                this.opacity = 1;
                this.isLanded = false;
            }

            update() {
                if (!this.isLanded) {
                    // Constant wind (config.windStrength) + gentle wobble
                    this.x += this.speedX + config.windStrength + Math.sin(this.angle) * 0.3;
                    this.y += this.speedY;
                    this.angle += this.spin;

                    // Landing logic
                    if (this.y >= canvas.height - 10) {
                        this.y = canvas.height - 10;
                        this.isLanded = true;
                    }
                } else {
                    // Landed petals slide slowly with the wind
                    this.x += config.windStrength * 0.5;
                    this.opacity -= config.fadeSpeed;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size / 1.8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Spawn on click only
        window.addEventListener('mousedown', (e) => {
            for (let i = 0; i < config.petalCount; i++) {
                particles.push(new Petal(e.clientX, e.clientY));
            }
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                // Cleanup: remove if opacity 0 OR if blown off screen to the right
                if (particles[i].opacity <= 0 || particles[i].x > canvas.width + 50) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
